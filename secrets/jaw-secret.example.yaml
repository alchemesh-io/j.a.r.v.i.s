# J.A.W — Worker Secrets
#
# Copy this file to jaw-secret.yaml and fill in the values.
# jaw-secret.yaml is gitignored and deployed via `make deploy` / `make deploy-local`.
#
# All values must be base64-encoded. Encode with:
#   echo -n "my-value" | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: jarvis-jaw-secret
  namespace: jarvis
  labels:
    app: jarvis-worker
type: Opaque
data:
  # --- Claude Code (provide one of the two) ---
  # Anthropic API key for Claude Code sessions in worker pods
  # ANTHROPIC_API_KEY: ""
  # OAuth token for Claude Code (alternative to API key)
  # CLAUDE_CODE_OAUTH_TOKEN: ""

  # --- Git ---
  # GitHub personal access token for cloning private repositories
  # GITHUB_TOKEN: ""

  # --- Datadog (pup) ---
  # Datadog API key, used by the `pup` CLI inside worker pods for telemetry/cost
  # reporting. Kept out of the ConfigMap-sourced remote-settings.json baseline
  # (worker.claudeConfig.remoteSettings) so it never lands in a git-tracked file.
  # DD_API_KEY: ""
  #
  # Datadog application key, required alongside DD_API_KEY for `pup` calls that need
  # an app-scoped key (most non-metrics-submission endpoints).
  # DD_APP_KEY: ""
  #
  # Datadog site to target (e.g. "datadoghq.com", "datadoghq.eu"). Required by `pup`
  # whenever the account is not on the default US1 site.
  # DD_SITE: ""

  # --- Google Workspace CLI (gws) ---
  # OAuth credentials JSON from `gws auth export` on your host.
  # Run `gws auth login` first, then:
  #   gws auth export | base64 | tr -d '\n'
  # Paste the resulting base64 string below.
  # The worker pod mounts this at /etc/gws/credentials.json (via GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE).
  # GOOGLE_WORKSPACE_CLI_CREDENTIALS: ""

  # --- HCP Terraform / Terraform Enterprise (tfctl, terraform) ---
  # API token for tfe.doctolib.net. Generate one from your TFE user settings, then:
  #   echo -n "<token>" | base64
  # Paste the resulting base64 string below. The worker pod writes this into
  # ~/.terraform.d/credentials.tfrc.json on boot, keyed to host "tfe.doctolib.net"
  # (the Terraform CLI credentials file is host-scoped, not org-scoped — org access
  # is determined by what the token itself is authorized for in TFE).
  # TFE_TOKEN: ""
