apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-worker-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-backend
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  # Subresources for the terminal bridge (backend/app/services/terminal.py) —
  # RBAC treats these as distinct resource types from bare "pods", so the rule
  # above does not cover them.
  - apiGroups: [""]
    resources: ["pods/attach", "pods/exec"]
    verbs: ["create", "get"]
