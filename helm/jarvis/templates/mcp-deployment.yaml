apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mcp
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mcp
        # GKE auto-discovery: marks this workload as an agent for the GCP Agent Registry.
        registry.gke.io/functional-type: "AGENT"
      annotations:
        # Points GKE auto-discovery at this deployment's live A2A Agent Card.
        a2a-protocol.org/agent-card: {{ printf "https://%s/.well-known/agent-card.json" .Values.gateway.mcpHost | quote }}
        # Workload Identity: lets the Agent Registry verify this workload's identity via SPIFFE.
        iam.gke.io/spiffe-identity-type: "agent-identity"
    spec:
      # Shares the jarvis-backend KSA (and its Workload Identity binding, see
      # worker-serviceaccount.yaml) so the SPIFFE annotation above resolves to a
      # real GCP identity.
      serviceAccountName: {{ .Release.Name }}-backend
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          args: ["python", "src/main.py", "--transport", "http", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: {{ .Values.mcp.backendUrl | default (printf "http://%s-backend:%d" .Release.Name (.Values.backend.service.port | int)) | quote }}
            - name: AGENT_CARD_URL
              value: {{ printf "https://%s/.well-known/agent-card.json" .Values.gateway.mcpHost | quote }}
            - name: AGENT_CARD_MCP_URL
              value: {{ printf "https://%s/mcp" .Values.gateway.mcpHost | quote }}
          resources: {{ toYaml .Values.mcp.resources | nindent 12 }}
