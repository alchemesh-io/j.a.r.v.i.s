# ServiceAccount for the worker POD itself (distinct from {{ .Release.Name }}-backend,
# defined in worker-serviceaccount.yaml, which the backend uses to manage worker pods).
# Intentionally has no RoleBinding: worker pods now carry their own identity instead of
# reusing the backend's — which would otherwise hand every worker the backend's own
# pods/attach, pods/exec, and pod/service/PVC create-delete permissions across the
# namespace. See openspec/changes/add-worker-infra-ops-tooling/design.md (Decision 3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-worker
