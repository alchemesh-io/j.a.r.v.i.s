name: Publish Artifacts to Agent Registry

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/**"

env:
  REGISTRY: ghcr.io
  ORG: alchemesh-io

jobs:
  publish-servers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        server:
          - name: jarvis
            path: artifacts/servers/jarvis
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "version=$(yq -r '.version' ${{ matrix.server.path }}/mcp.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install arctl
        run: curl -fsSL https://raw.githubusercontent.com/agentregistry-dev/agentregistry/main/scripts/get-arctl | bash

      - name: Build and push
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.server.name }}
          arctl mcp build ${{ matrix.server.path }} --image ${IMAGE}:${{ steps.meta.outputs.version }} --push
          arctl mcp build ${{ matrix.server.path }} --image ${IMAGE}:latest --push

  publish-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for google-github-actions/auth (Workload Identity Federation)
    strategy:
      matrix:
        skill:
          - name: planner-daily-wrap-up
            path: artifacts/skills/planner__daily_wrap_up
    steps:
      - uses: actions/checkout@v4

      - name: Check for SKILL.md
        id: check
        run: |
          if [ -f "${{ matrix.skill.path }}/SKILL.md" ]; then
            echo "has_skill=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_skill=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from SKILL.md
        id: meta
        if: steps.check.outputs.has_skill == 'true'
        run: |
          VERSION=$(grep -m1 '^version:' ${{ matrix.skill.path }}/SKILL.md | sed 's/^version:[[:space:]]*//' || echo "latest")
          if [ -z "$VERSION" ]; then VERSION="latest"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Requires a Workload Identity Federation provider + service account with
      # roles/storage.objectAdmin on the skills bucket. See design.md's Open
      # Questions for the owning-repo decision on provisioning these.
      - name: Authenticate to Google Cloud
        if: steps.check.outputs.has_skill == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.SKILLS_BUCKET_WIF_PROVIDER }}
          service_account: ${{ secrets.SKILLS_BUCKET_WIF_SERVICE_ACCOUNT }}

      - name: Upload skill files to GCS
        if: steps.check.outputs.has_skill == 'true'
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ matrix.skill.path }}
          destination: ${{ secrets.SKILLS_BUCKET }}/${{ matrix.skill.name }}/${{ steps.meta.outputs.version }}
          parent: false
