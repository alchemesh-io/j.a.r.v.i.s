apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Git-sourced: works on any cluster, no minikube mount required.
    # Use jarvis-app-local.yaml for the mount-based local inner loop.
    repoURL: https://github.com/alchemesh-io/j.a.r.v.i.s.git
    path: helm/jarvis
    targetRevision: main
    helm:
      releaseName: jarvis
  destination:
    server: https://kubernetes.default.svc
    namespace: jarvis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
